<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mother's Day Memory Match</title>
    <style>
        :root {
            --pink: #ffafcc;
            --dark-pink: #fb6f92;
            --soft-white: #fff0f3;
            --overlay: rgba(0, 0, 0, 0.7);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--soft-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #4a4a4a;
        }

        h1 {
            color: var(--dark-pink);
            margin-top: 20px;
        }

        .game-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 400px;
            margin: 20px;
        }

        .card {
            width: 80px;
            height: 80px;
            background-color: var(--pink);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* The '?' side */
        .card::before {
            content: '?';
            font-size: 2rem;
            color: white;
            position: absolute;
            backface-visibility: hidden;
        }

        /* The Image side */
        .card img {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            object-fit: cover;
            display: none; /* Hidden until flipped */
        }

        .card.flipped {
            transform: rotateY(180deg);
            background-color: white;
        }

        .card.flipped img {
            display: block;
            transform: rotateY(180deg);
        }

        .card.flipped::before {
            display: none;
        }

        .card.matched {
            visibility: hidden;
            pointer-events: none;
        }

        /* Note Overlay */
        #note-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }

        .note-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 80%;
            border: 4px solid var(--pink);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        button {
            padding: 12px 25px;
            background-color: var(--dark-pink);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Mother's Day Memory Match</h1>
    <p>Match the photos to see your surprise!</p>
    
    <div class="game-container" id="game-board"></div>

    <button onclick="resetGame()">Restart Game</button>

    <div id="note-overlay">
        <div class="note-card">
            <h2>To the Best Mom Ever ❤️</h2>
            <p>
                Happy Mother's Day! <br><br>
                Thank you for all the wonderful memories. <br>
                I hope you enjoyed seeing these photos!
            </p>
            <button onclick="closeNote()">Play Again</button>
        </div>
    </div>

    <script>
        // Array of image paths (image1.jpg to image8.jpg)
        const imageFiles = [
            'images/image1.jpg', 'images/image2.jpg', 'images/image3.jpg', 'images/image4.jpg',
            'images/image5.jpg', 'images/image6.jpg', 'images/image7.jpg', 'images/image8.jpg'
        ];

        let cards = [...imageFiles, ...imageFiles];
        let flippedCards = [];
        let matchedCount = 0;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function createBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            shuffle(cards).forEach((imgSrc) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.source = imgSrc;
                
                const img = document.createElement('img');
                img.src = imgSrc;
                
                card.appendChild(img);
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            if (flippedCards.length < 2 && !this.classList.contains('flipped')) {
                this.classList.add('flipped');
                flippedCards.push(this);

                if (flippedCards.length === 2) {
                    checkMatch();
                }
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            if (card1.dataset.source === card2.dataset.source) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedCount += 2;
                    flippedCards = [];
                    if (matchedCount === cards.length) showNote();
                }, 600);
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                }, 1000);
            }
        }

        function showNote() { document.getElementById('note-overlay').style.display = 'flex'; }
        function closeNote() { document.getElementById('note-overlay').style.display = 'none'; resetGame(); }
        function resetGame() { matchedCount = 0; flippedCards = []; createBoard(); }

        createBoard();
    </script>
</body>
</html>
